name: Cleave

options:
  bundleIdPrefix: com.cleave
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.54.1

targets:
  Cleave:
    type: application
    platform: iOS
    sources:
      - path: Cleave
        excludes:
          - "**/*.entitlements"
          - "Resources/Info.plist"
    dependencies:
      - package: Supabase
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Cleave/Cleave.entitlements
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Cleave/Resources/Info.plist
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: "$(CLEAVE_BUNDLE_IDENTIFIER)"
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: 1
      configs:
        Debug:
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES

  CleaveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CleaveTests
    dependencies:
      - target: Cleave
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: "$(CLEAVE_BUNDLE_IDENTIFIER).Tests"
        SWIFT_VERSION: 5.0

schemes:
  Cleave:
    build:
      targets:
        Cleave: all
        CleaveTests: [test]
    test:
      targets:
        - CleaveTests
