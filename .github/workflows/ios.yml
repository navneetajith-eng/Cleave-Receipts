name: iOS Build and Tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Generate Xcode project
        run: ./xcodegen/bin/xcodegen generate --spec iOS/project.yml --project iOS
      - name: Verify generated project is committed
        run: git diff --exit-code -- iOS/Cleave.xcodeproj
      - name: Run iOS unit tests
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable == true and (.name | startswith("iPhone")))] | first | .udid')
          test -n "$DEVICE_ID"
          xcodebuild \
            -project iOS/Cleave.xcodeproj \
            -scheme Cleave \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Build clean Release configuration
        run: |
          xcodebuild \
            -project iOS/Cleave.xcodeproj \
            -scheme Cleave \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            clean build
