name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPO_NAME: fidelity-repo
  SERVICE_NAME: fidelity-backend

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Install dependencies
        run: pip install -r Backend/requirements.txt
      - name: Run backend tests
        run: python -m pytest Backend/tests -q

  deploy:
    needs: backend-tests
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Provision private receipt bucket
        run: |
          if ! gcloud storage buckets describe "gs://$PROJECT_ID-receipt-images" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://$PROJECT_ID-receipt-images" \
              --location="$REGION" \
              --uniform-bucket-level-access
          fi
          runtime_service_account="$(gcloud run services describe "$SERVICE_NAME" \
            --region="$REGION" \
            --format='value(spec.template.spec.serviceAccountName)')"
          if [ -z "$runtime_service_account" ]; then
            project_number="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
            runtime_service_account="$project_number-compute@developer.gserviceaccount.com"
          fi
          gcloud storage buckets add-iam-policy-binding "gs://$PROJECT_ID-receipt-images" \
            --member="serviceAccount:$runtime_service_account" \
            --role="roles/storage.objectUser"

      - name: Configure Docker to use Google Artifact Registry
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: Build Docker image
        run: docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:${{ github.sha }} ./Backend

      - name: Push Docker image
        run: docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$SERVICE_NAME:${{ github.sha }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            DATABASE_URL=${{ secrets.SUPABASE_DATABASE_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            GCS_BUCKET_NAME=${{ secrets.GCP_PROJECT_ID }}-receipt-images

      - name: Verify deployed API health
        run: curl --fail --show-error --silent --retry 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/health"
